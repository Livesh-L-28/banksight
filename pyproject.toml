[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "backend/migrations/versions",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # line too long
    "F401",  # unused import
    "F841",  # unused variable
    "B008",  # function call in default argument
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

