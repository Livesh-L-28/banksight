apiVersion: v1
kind: ConfigMap
metadata:
  name: banksight-config
  namespace: banksight-production
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "pgbouncer-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "banksight_db"
  POSTGRES_USER: "banksight_admin"
  DATABASE_URL: "postgresql://banksight_admin:postgres_pass@pgbouncer-service:5432/banksight_db"
  API_PORT: "8000"
  STREAMLIT_PORT: "8501"
  ENABLE_AUDIT_LOGGING: "true"

