apiVersion: apps/v1
kind: Deployment
metadata:
  name: banksight-api
  namespace: banksight-production
  labels:
    app.kubernetes.io/name: banksight-api
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: banksight-api
  template:
    metadata:
      labels:
        app: banksight-api
    spec:
      containers:
        - name: api
          image: ghcr.io/livesh-l-28/banksight:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: banksight-config
            - secretRef:
                name: banksight-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3

