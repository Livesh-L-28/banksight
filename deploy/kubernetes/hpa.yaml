apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: banksight-api-hpa
  namespace: banksight-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: banksight-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
