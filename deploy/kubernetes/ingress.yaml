apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banksight-ingress
  namespace: banksight-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - banksight.internal.bank
      secretName: banksight-tls-cert
  rules:
    - host: banksight.internal.bank
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: banksight-api-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: banksight-api-service
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: banksight-api-service
                port:
                  number: 8000
